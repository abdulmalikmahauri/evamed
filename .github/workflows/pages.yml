name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права нужны самому процессу выкладки, а не токену в репозитории
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: побеждает последняя
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Статическая выгрузка: сервера на Pages нет
      EVAMED_STATIC: 'true'
      # Подпуть репозитория. При переезде на свой домен — убрать вместе с basePath
      EVAMED_BASE_PATH: /evamed
      # Формы работают в браузере, приёмник не настроен: данные никуда не уходят
      EVAMED_FORMS: 'true'
      # Индексация закрыта: реквизиты лицензии ещё не получены
      EVAMED_PUBLIC: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка статической версии
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
